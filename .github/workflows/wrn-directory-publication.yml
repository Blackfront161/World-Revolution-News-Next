name: WRN legacy Website preparation (manual, no publication)

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: Optional exact public DATA commit for a read-only preparation run.
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare-only:
    if: github.repository == 'Blackfront161/World-Revolution-News-Next' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Prepare and validate without any publication credentials
        env:
          REQUESTED_COMMIT: ${{ inputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          commit="${REQUESTED_COMMIT:-}"
          if [[ -z "$commit" ]]; then
            commit="$(timeout 20s git ls-remote https://github.com/Blackfront161/Revolution-News-Data.git refs/heads/main | awk 'NF == 2 { print $1; exit }')"
          fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          target="$GITHUB_WORKSPACE/.wrn-actions-output/website-content-tuple"
          sequence="$(date -u +%Y%m%d%H%M)"
          node tools/directory/observe-and-prepare-website-tuple.mjs --commit "$commit" --output "$target" --sequence "$sequence"
          node tools/directory/publish-website-content-tuple.mjs --output "$target" --expected-commit "$commit"
