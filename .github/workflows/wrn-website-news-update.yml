name: WRN hourly Website news update

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: Optional exact 40-character commit from the legacy data repository.
        required: false
        type: string
      publish:
        description: Publish only when the repository switch and scoped Hostinger secrets are configured.
        required: false
        default: false
        type: boolean
      scope_probe:
        description: Read-only TLS and restricted account-root verification; never publishes.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wrn-current-directory-publication
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    if: github.repository == 'Blackfront161/World-Revolution-News-Next' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 37cafdf052972dadb3c6f41b878f4e387b0826d1
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Check delivery configuration without revealing secret values
        env:
          WRN_DIRECTORY_PUBLISH_ENABLED: ${{ vars.WRN_DIRECTORY_PUBLISH_ENABLED }}
          WRN_FTPS_HOST: ${{ secrets.WRN_FTPS_HOST }}
          WRN_FTPS_IP: ${{ secrets.WRN_FTPS_IP }}
          WRN_FTPS_USER: ${{ secrets.WRN_FTPS_USER }}
          WRN_FTPS_PASSWORD: ${{ secrets.WRN_FTPS_PASSWORD }}
          WRN_FTPS_DIRECTORY: '/'
          EXPLICIT_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXPLICIT_PUBLISH" == 'true' ]]; then
            node tools/directory/check-directory-publication-config.mjs --explicit-publish
          else
            node tools/directory/check-directory-publication-config.mjs
          fi
      - id: upstream
        name: Resolve exact upstream commit
        env:
          REQUESTED_COMMIT: ${{ inputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          commit="${REQUESTED_COMMIT:-}"
          if [[ -z "$commit" ]]; then
            commit="$(timeout 20s git ls-remote https://github.com/Blackfront161/Revolution-News-Data.git refs/heads/main | awk 'NF == 2 { print $1; exit }')"
          fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Read-only restricted FTP account verification
        if: inputs.scope_probe == true && inputs.publish != true
        env:
          WRN_FTPS_HOST: ${{ secrets.WRN_FTPS_HOST }}
          WRN_FTPS_IP: ${{ secrets.WRN_FTPS_IP }}
          WRN_FTPS_USER: ${{ secrets.WRN_FTPS_USER }}
          WRN_FTPS_PASSWORD: ${{ secrets.WRN_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          python3 tools/directory/probe-website-news-scope.py
          node --input-type=module <<'NODE'
          import {createFtpsTransport} from './tools/directory/publish-live-content-directory.mjs';
          import {createWebsiteTupleHttpGuard} from './tools/directory/website-tuple-http-guard.mjs';
          import {readPublicWebsiteTuplePointerBytes,websiteTuplePublicBase} from './tools/directory/publish-website-content-tuple.mjs';
          import {parseManagedListing,readAutomationState} from './tools/directory/website-tuple-retention.mjs';
          import {projectionHash} from './tools/directory/website-content-projection.mjs';
          const transport=createFtpsTransport({host:process.env.WRN_FTPS_HOST,ip:process.env.WRN_FTPS_IP,user:process.env.WRN_FTPS_USER,password:process.env.WRN_FTPS_PASSWORD,remoteRoot:'/',profile:'website-tuple'});
          const http=createWebsiteTupleHttpGuard();
          const current=JSON.parse(await readPublicWebsiteTuplePointerBytes(http.fetch));
          const body=await http.fetch(new URL(current.artifactPath,websiteTuplePublicBase));
          const bytes=Buffer.from(await body.arrayBuffer());
          if(bytes.length!==current.artifactBytes||projectionHash(bytes)!==current.artifactSha256)throw Error('scope-public-snapshot-binding');
          const root=parseManagedListing(await transport.listManaged(''));
          const snapshots=parseManagedListing(await transport.listManaged('snapshots/'),'snapshots/');
          const state=await transport.readAutomationState();
          readAutomationState(state,current);
          console.log(JSON.stringify({state:'curl-tls-mlsd-state-read-pass',readOnly:true,rootEntries:root.length,snapshotEntries:snapshots.length,stateExists:state!==null,http:http.receipt(),publicationPerformed:false}));
          NODE
      - id: packet
        name: Prepare and validate complete metadata-only Website content packet
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/mobile/src/features/directory/data/content-directory-v1.json'
          website='apps/website/src/features/directory/data/content-directory-v1.json'
          cmp --silent "$mobile" "$website"
          target="$GITHUB_WORKSPACE/.wrn-actions-output/website-content-tuple"
          mkdir -p "$GITHUB_WORKSPACE/.wrn-actions-output"
          sequence="$(date -u +%Y%m%d%H%M)"
          node tools/directory/observe-and-prepare-website-tuple.mjs \
            --commit "$UPSTREAM_COMMIT" \
            --output "$target" \
            --sequence "$sequence" >/dev/null
          node tools/directory/publish-website-content-tuple.mjs \
            --output "$target" \
            --expected-commit "$UPSTREAM_COMMIT"
          printf 'directory=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: Publish snapshot, verify, then activate pointer
        if: vars.WRN_DIRECTORY_PUBLISH_ENABLED == '1' && inputs.scope_probe != true && (github.event_name == 'schedule' || inputs.publish == true)
        env:
          WRN_DIRECTORY_PUBLISH_ENABLED: '1'
          WRN_FTPS_HOST: ${{ secrets.WRN_FTPS_HOST }}
          WRN_FTPS_IP: ${{ secrets.WRN_FTPS_IP }}
          WRN_FTPS_USER: ${{ secrets.WRN_FTPS_USER }}
          WRN_FTPS_PASSWORD: ${{ secrets.WRN_FTPS_PASSWORD }}
          WRN_FTPS_DIRECTORY: '/'
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
          PACKET_DIRECTORY: ${{ steps.packet.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {loadPreparedWebsiteTuple,publishPreparedWebsiteTuple,readPublicWebsiteTuplePointerBytes} from './tools/directory/publish-website-content-tuple.mjs';
          import {createFtpsTransport} from './tools/directory/publish-live-content-directory.mjs';
          import {createWebsiteTupleHttpGuard} from './tools/directory/website-tuple-http-guard.mjs';
          import {publishManagedWebsiteTuple} from './tools/directory/publish-managed-website-tuple.mjs';
          if(process.env.WRN_DIRECTORY_PUBLISH_ENABLED!=='1'||process.env.WRN_FTPS_DIRECTORY!=='/')throw Error('scoped-tuple-publisher-disabled');
          const images=JSON.parse(await fs.readFile('apps/website/src/features/home/app-article-images-v1.json'));
          const prepared=await loadPreparedWebsiteTuple({output:process.env.PACKET_DIRECTORY,expectedCommit:process.env.UPSTREAM_COMMIT,allowedImageOrigins:images.origins});
          const transport=createFtpsTransport({host:process.env.WRN_FTPS_HOST,ip:process.env.WRN_FTPS_IP,user:process.env.WRN_FTPS_USER,password:process.env.WRN_FTPS_PASSWORD,remoteRoot:'/',profile:'website-tuple'});
          const http=createWebsiteTupleHttpGuard();
          const outcome=await publishManagedWebsiteTuple({prepared,transport,fetchPublic:http.fetch,fetchCurrentBytes:()=>readPublicWebsiteTuplePointerBytes(http.fetch)});
          console.log(JSON.stringify({...outcome,http:http.receipt()}));
          NODE
