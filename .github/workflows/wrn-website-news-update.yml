name: WRN hourly Website news update

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: Optional exact 40-character commit from the legacy data repository.
        required: false
        type: string
      publish:
        description: Publish only when the repository switch and scoped Hostinger secrets are configured.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wrn-current-directory-publication
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    if: github.repository == 'Blackfront161/World-Revolution-News-Next' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b817ca8f7668cedfc7d20f81b8c732c11d859032
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Check delivery configuration without revealing secret values
        env:
          WRN_DIRECTORY_PUBLISH_ENABLED: ${{ vars.WRN_DIRECTORY_PUBLISH_ENABLED }}
          WRN_FTPS_HOST: ${{ secrets.WRN_FTPS_HOST }}
          WRN_FTPS_IP: ${{ secrets.WRN_FTPS_IP }}
          WRN_FTPS_USER: ${{ secrets.WRN_FTPS_USER }}
          WRN_FTPS_PASSWORD: ${{ secrets.WRN_FTPS_PASSWORD }}
          WRN_FTPS_DIRECTORY: '/'
          EXPLICIT_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXPLICIT_PUBLISH" == 'true' ]]; then
            node tools/directory/check-directory-publication-config.mjs --explicit-publish
          else
            node tools/directory/check-directory-publication-config.mjs
          fi
      - id: upstream
        name: Resolve exact upstream commit
        env:
          REQUESTED_COMMIT: ${{ inputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          commit="${REQUESTED_COMMIT:-}"
          if [[ -z "$commit" ]]; then
            commit="$(timeout 20s git ls-remote https://github.com/Blackfront161/Revolution-News-Data.git refs/heads/main | awk 'NF == 2 { print $1; exit }')"
          fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - id: packet
        name: Prepare and validate complete metadata-only Website content packet
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/mobile/src/features/directory/data/content-directory-v1.json'
          website='apps/website/src/features/directory/data/content-directory-v1.json'
          cmp --silent "$mobile" "$website"
          target="$GITHUB_WORKSPACE/.wrn-actions-output/website-content-tuple"
          mkdir -p "$GITHUB_WORKSPACE/.wrn-actions-output"
          sequence="$(date -u +%Y%m%d%H%M)"
          node --input-type=module -e 'import fs from "node:fs/promises";const p="apps/website/src/features/home/app-article-images-v1.json";const v=JSON.parse(await fs.readFile(p));v.origins=["https://64.media.tumblr.com","https://africanarguments.org","https://agenciatierraviva.com.ar","https://animalequality.de","https://animalliberationpressoffice.org","https://apublica.org","https://argentina.indymedia.org","https://avtonom.org","https://cdn.nunatsiaq.com","https://edri.org","https://english.anf-news.com","https://es.anarchistlibraries.net","https://feminist.org","https://i0.wp.com","https://infoaut.org","https://infolibre.gr","https://manilatoday.net","https://mars-infos.org","https://media.indiginews.com","https://minorityafrica.org","https://newbloommag.net","https://novaramedia.com","https://paris-luttes.info","https://publish.barrikade.info","https://rebellyon.info","https://roape.net","https://ru.anarchistlibraries.net","https://slackbastard.anarchobase.com","https://static.bianet.org","https://static.wixstatic.com","https://storage.ghost.io","https://theanarchistlibrary.org","https://theappeal.org","https://truthout.org","https://unoffensiveanimal.is","https://ur-web1.unicornriot.ninja","https://wagingnonviolence.org","https://winteroak.org.uk","https://womin.africa","https://worldbeyondwar.org","https://www.alerta.gr","https://www.anred.org","https://www.aptnnews.ca","https://www.blackrosefed.org","https://www.bulatlat.com","https://www.eff.org","https://www.evrensel.net","https://www.greenleft.org.au","https://www.groundxero.in","https://www.huntsabs.org.uk","https://www.kinimatorama.net","https://www.l214.com","https://www.labournet.de","https://www.madamasr.com","https://www.madinamerica.com","https://www.peta.de","https://www.roundtableindia.co.in","https://www.theelephant.info","https://znetwork.org"];await fs.writeFile(p,JSON.stringify(v));'
          node tools/directory/observe-and-prepare-website-tuple.mjs \
            --commit "$UPSTREAM_COMMIT" \
            --output "$target" \
            --sequence "$sequence" >/dev/null
          node tools/directory/publish-website-content-tuple.mjs \
            --output "$target" \
            --expected-commit "$UPSTREAM_COMMIT"
          printf 'directory=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: Publish snapshot, verify, then activate pointer
        if: vars.WRN_DIRECTORY_PUBLISH_ENABLED == '1' && (github.event_name == 'schedule' || inputs.publish == true)
        env:
          WRN_DIRECTORY_PUBLISH_ENABLED: '1'
          WRN_FTPS_HOST: ${{ secrets.WRN_FTPS_HOST }}
          WRN_FTPS_IP: ${{ secrets.WRN_FTPS_IP }}
          WRN_FTPS_USER: ${{ secrets.WRN_FTPS_USER }}
          WRN_FTPS_PASSWORD: ${{ secrets.WRN_FTPS_PASSWORD }}
          WRN_FTPS_DIRECTORY: '/'
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
          PACKET_DIRECTORY: ${{ steps.packet.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {loadPreparedWebsiteTuple,publishPreparedWebsiteTuple} from './tools/directory/publish-website-content-tuple.mjs';
          import {createFtpsTransport} from './tools/directory/publish-live-content-directory.mjs';
          if(process.env.WRN_DIRECTORY_PUBLISH_ENABLED!=='1'||process.env.WRN_FTPS_DIRECTORY!=='/')throw Error('scoped-tuple-publisher-disabled');
          const images=JSON.parse(await fs.readFile('apps/website/src/features/home/app-article-images-v1.json'));
          const prepared=await loadPreparedWebsiteTuple({output:process.env.PACKET_DIRECTORY,expectedCommit:process.env.UPSTREAM_COMMIT,allowedImageOrigins:images.origins});
          const transport=createFtpsTransport({host:process.env.WRN_FTPS_HOST,ip:process.env.WRN_FTPS_IP,user:process.env.WRN_FTPS_USER,password:process.env.WRN_FTPS_PASSWORD,remoteRoot:'/',profile:'website-tuple'});
          console.log(JSON.stringify(await publishPreparedWebsiteTuple({prepared,transport})));
          NODE
